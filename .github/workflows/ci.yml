name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fake Odoo and CSV import (unit tests)
        run: |
          python3 -m unittest discover -s data-sync/fake_odoo -v
          python3 -m unittest discover -s data-sync/csv -v
      - name: Database (49 constraint tests, 9 + 9 privilege tests)
        run: bash database/test-local.sh
      - name: Menu sync end to end (dry run, idempotence, price change, new dish)
        run: bash data-sync/test_sync.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck (errors)
        run: git ls-files '*.sh' | xargs shellcheck -S error
      - name: Python compiles
        run: git ls-files '*.py' | xargs python3 -m py_compile
      - name: Compose files are valid
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f erp/docker-compose.yml --env-file erp/.env.example config -q
      - uses: hashicorp/setup-terraform@v3
      - name: terraform validate
        run: |
          terraform -chdir=cloud/terraform fmt -check -recursive
          terraform -chdir=cloud/terraform init -backend=false -input=false
          terraform -chdir=cloud/terraform validate
      - name: Arcade stick debounce test (host build with stubs)
        run: bash also-built/arcade-stick/debounce-test/run.sh

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: docker compose up (the one-command demo)
        run: docker compose up --build --abort-on-container-exit --exit-code-from sync

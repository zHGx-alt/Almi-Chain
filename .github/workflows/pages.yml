# Publishes also-built/web/ on GitHub Pages (Settings -> Pages -> Source: GitHub Actions).
name: pages

on:
  push:
    branches: [main]
    paths: ["also-built/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: also-built/web
      - id: deployment
        uses: actions/deploy-pages@v4

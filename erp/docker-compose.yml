# Odoo + PostgreSQL with Docker.
# Passwords live in .env (generated by deploy-odoo.sh and never committed; see .env.example).
name: odoo

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks: [internal]          # no "ports": PostgreSQL is not reachable from outside Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:${ODOO_VERSION}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
    # Plain HTTP on the LAN until the HTTPS proxy is enabled (https/enable-https.sh), which
    # then publishes it on 127.0.0.1 only so nobody can bypass the proxy unencrypted.
    ports:
      - "8069:8069"
    networks: [internal]

volumes:
  odoo-db-data:
  odoo-web-data:

networks:
  internal:

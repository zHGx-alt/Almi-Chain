# HTTPS proxy in front of Odoo. Layered on top of ../docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
# (enable-https.sh pins it with COMPOSE_FILE in .env, so any "docker compose up" includes it.)
services:
  odoo:
    # Odoo stops listening on the LAN: only the proxy ("internal" network) and the server itself see it.
    # "!override" replaces the base file's port list instead of adding to it (Compose 2.24 or later).
    ports: !override
      - "127.0.0.1:8069:8069"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [odoo]
    ports:
      - "80:80"     # only redirects to HTTPS
      - "443:443"
    volumes:
      - ./https/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./https/certs:/etc/nginx/certs:ro
    networks: [internal]

### Preseed for an unattended Debian 13 install of the ERP server.

# Locale, keyboard and time zone (the restaurant is in Spain)
d-i debian-installer/locale string es_ES.UTF-8
d-i keyboard-configuration/xkb-keymap select es
d-i console-setup/ask_detect boolean false
d-i time/zone string Europe/Madrid
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string erp-server
d-i netcfg/get_domain string

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false

# Users: no root login, so "technician" gets sudo
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Administrator
d-i passwd/username string technician
d-i passwd/user-password password @@VBOX_INSERT_USER_PASSWORD@@
d-i passwd/user-password-again password @@VBOX_INSERT_USER_PASSWORD@@

# Partitioning: whole disk, one partition
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Software: NO desktop environment, only standard utilities + SSH
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server unattended-upgrades
# Automatic security patches from the first boot
unattended-upgrades unattended-upgrades/enable_auto_updates boolean true
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

# GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda
d-i finish-install/reboot_in_progress note

# Hardening:
#  - SSH with keys only: no password, no keyboard-interactive and no root.
#  - The authorised key is the manager PC's. SSH_PUBLIC_KEY is replaced BEFORE installing;
#    if it is not, authorized_keys stays empty and the only way in is the console.
#  - unattended-upgrades on (20auto-upgrades), in case the debconf answer above is not applied.
d-i preseed/late_command string mkdir -p /target/etc/ssh/sshd_config.d;  printf 'PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin no\n' >/target/etc/ssh/sshd_config.d/10-hardening.conf;  printf 'APT::Periodic::Update-Package-Lists "1";\nAPT::Periodic::Unattended-Upgrade "1";\n' >/target/etc/apt/apt.conf.d/20auto-upgrades;  mkdir -p /target/home/technician/.ssh;  echo 'SSH_PUBLIC_KEY' | grep -v '^SSH_PUBLIC_KEY$' > /target/home/technician/.ssh/authorized_keys || true;  in-target chown -R technician:technician /home/technician/.ssh;  in-target chmod 700 /home/technician/.ssh;  in-target chmod 600 /home/technician/.ssh/authorized_keys
